version: "3.8"

services:
  api:
    build: ./backend
    container_name: korsh-wallet-api
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=3011
      - RPC_HOST=127.0.0.1
      - RPC_PORT=9776
      - RPC_USER=korsh_rpc
      - RPC_PASS=${RPC_PASS}
      - CORS_ORIGIN=https://wallet.korsh.org
      - EXPLORER_URL=http://127.0.0.1:8091

  frontend:
    image: nginx:alpine
    container_name: korsh-wallet-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wallet

networks:
  wallet:
    driver: bridge
